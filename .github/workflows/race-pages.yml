# Loppsidor: Mila's public race pages (lopp/, en/races/, de/laeufe/, nb/lop/, da/lob/, fi/kisat/, fr/courses/, es/carreras/ with their hubs, sitemap.xml, robots.txt, the IndexNow key file and,
# once approved, the guides in guider/, en/guides/, de/ratgeber/) generated from the public race feed by tools/race_pages.ts, every hour
# and on demand (Actions → Loppsidor → Run workflow). Commits only when a file changed; GitHub Pages then publishes the commit, and the
# addresses that changed go to IndexNow (Bing and others). No secrets: the feed is public and the IndexNow key is public by design. The
# App Store link and id and the IndexNow key come from tools/race_pages.json.
# Source: backend/race_pages_workflow.yml in the Mila repo, published here as .github/workflows/race-pages.yml by backend/publish_legal.sh.
name: Loppsidor

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

# contents: write to push the pages; pages: write only for the last step's build request (POST /pages/builds)
permissions:
  contents: write
  pages: write

# one run at a time; a run started meanwhile waits and then builds from the newest feed
concurrency:
  group: race-pages
  cancel-in-progress: false

jobs:
  pages:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # actions pinned to a commit (the tag named beside it), Deno to one exact release (review round 24): nothing changes under the
      # workflow without a commit here
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: 2.9.7

      - name: Generate the race pages
        run: >
          deno run --no-prompt
          --allow-net=vfjofaniwtudzvadxpsd.supabase.co,cdn.jsdelivr.net
          --allow-read=. --allow-write=.,${{ runner.temp }}
          tools/race_pages.ts --out . --changed ${{ runner.temp }}/indexnow-changed.txt

      - name: Commit and push when something changed
        id: push
        run: |
          # the identity for the whole job: a push that loses a race pulls with --rebase, which rewrites the commit and needs it too
          # (2026-10-15: "empty ident name" when the site was published at the same moment)
          git config user.name "Mila"; git config user.email "mila@users.noreply.github.com"
          # the pages, the sitemap, robots.txt and the IndexNow key file ('*.txt'); the guides' folder once it exists (or as it leaves)
          git add -A -- lopp en de nb da fi fr es sitemap.xml robots.txt '*.txt'
          if [ -d guider ] || [ -n "$(git ls-files guider)" ]; then git add -A -- guider; fi
          if git diff --cached --quiet; then echo "Inga ändringar."; exit 0; fi
          git commit -qm "Loppsidor $(date -u +%F)"
          for i in 1 2 3; do
            if git push -q origin HEAD:main; then echo "pushed=true" >> "$GITHUB_OUTPUT"; exit 0; fi
            git pull -q --rebase origin main
          done
          exit 1

      # a push with the workflow's own token normally starts the Pages build; asking for one as well is harmless and makes sure
      - name: Publish with GitHub Pages
        if: steps.push.outputs.pushed == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" > /dev/null

      # IndexNow: only the addresses this run changed (new, edited or gone; at most 2 000), after GitHub Pages has published them (it is
      # asked for above; at most five minutes here). The key is public by design (its file is at the site's root); no secret is sent
      - name: Tell search engines what changed (IndexNow)
        if: steps.push.outputs.pushed == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 30); do [ "$(gh api "repos/${{ github.repository }}/pages/builds/latest" -q .status 2>/dev/null)" = built ] && break; sleep 10; done
          deno run --no-prompt --allow-net=api.indexnow.org --allow-read=tools,${{ runner.temp }} tools/race_pages.ts --indexnow-ping ${{ runner.temp }}/indexnow-changed.txt
